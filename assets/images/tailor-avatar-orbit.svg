<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="apronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="iconBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="iconBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="orbitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.18"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="250" cy="250" r="230" fill="#f8faff"/>
  <circle cx="250" cy="250" r="190" fill="#f1f5fd" opacity="0.7"/>

  <!-- Outer Orbit (Dashed) -->
  <circle cx="250" cy="250" r="200" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="6 8" fill="none"/>

  <!-- Inner Orbit (Dashed) -->
  <circle cx="250" cy="250" r="145" stroke="#a5b4fc" stroke-width="1.8" stroke-dasharray="5 7" fill="none"/>

  <!-- Radial connecting accents -->
  <line x1="250" y1="250" x2="70" y2="190" stroke="#e0e7ff" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="250" y1="250" x2="410" y2="160" stroke="#e0e7ff" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="250" y1="250" x2="420" y2="340" stroke="#e0e7ff" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="250" y1="250" x2="90" y2="335" stroke="#e0e7ff" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Central Tailor Portrait Circle -->
  <g filter="url(#orbitGlow)">
    <!-- White rim border -->
    <circle cx="250" cy="250" r="95" fill="#ffffff"/>
    <circle cx="250" cy="250" r="88" fill="url(#avatarBg)"/>

    <g clip-path="url(#avatarClip)">
      <clipPath id="avatarClip">
        <circle cx="250" cy="250" r="88"/>
      </clipPath>

      <!-- Tailor Character -->
      <!-- White shirt -->
      <path d="M190,340 L190,270 C190,240 220,230 250,230 C280,230 310,240 310,270 L310,340 Z" fill="#ffffff"/>
      <!-- Collar -->
      <polygon points="230,225 250,250 240,225" fill="#f1f5f9"/>
      <polygon points="270,225 250,250 260,225" fill="#e2e8f0"/>

      <!-- Purple Apron -->
      <path d="M205,255 L295,255 L305,340 L195,340 Z" fill="url(#apronGrad)"/>
      <path d="M225,225 L235,255 L245,255 L235,225 Z" fill="#4338ca"/>
      <path d="M275,225 L265,255 L255,255 L265,225 Z" fill="#3730a3"/>
      <!-- Apron pocket with scissors peak -->
      <rect x="235" y="295" width="30" height="25" rx="3" fill="#4338ca"/>
      <line x1="247" y1="290" x2="253" y2="300" stroke="#f59e0b" stroke-width="2"/>

      <!-- Measuring Tape draped around neck -->
      <path d="M220,228 C215,250 215,280 218,310" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" fill="none" stroke-dasharray="1 2"/>
      <path d="M280,228 C285,250 285,285 280,320" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" fill="none" stroke-dasharray="1 2"/>

      <!-- Neck -->
      <rect x="238" y="200" width="24" height="30" fill="#fbcfe8" rx="4"/>
      <path d="M238,215 C244,225 256,225 262,215 L262,228 L238,228 Z" fill="#f472b6" opacity="0.3"/>

      <!-- Head / Face -->
      <ellipse cx="250" cy="180" rx="32" ry="38" fill="#fce7f3"/>
      <!-- Ears -->
      <circle cx="218" cy="180" r="7" fill="#fce7f3"/>
      <circle cx="282" cy="180" r="7" fill="#fce7f3"/>

      <!-- Eyes & Eyebrows -->
      <ellipse cx="238" cy="175" rx="3.5" ry="4" fill="#1e293b"/>
      <ellipse cx="262" cy="175" rx="3.5" ry="4" fill="#1e293b"/>
      <circle cx="239" cy="173" r="1.2" fill="#ffffff"/>
      <circle cx="263" cy="173" r="1.2" fill="#ffffff"/>
      <path d="M231,168 C236,165 243,166 245,168" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M255,168 C257,166 264,165 269,168" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

      <!-- Friendly Smile -->
      <path d="M239,192 C245,200 255,200 261,192" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Neat Beard/Stubble -->
      <path d="M225,180 C225,215 275,215 275,180 C275,190 270,208 250,210 C230,208 225,190 225,180 Z" fill="#1e293b" opacity="0.85"/>
      <path d="M238,190 C245,194 255,194 262,190" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>

      <!-- Hair -->
      <path d="M218,170 C216,145 235,140 250,140 C268,140 284,145 282,170 C276,152 268,148 250,148 C232,148 224,152 218,170 Z" fill="#0f172a"/>
    </g>
  </g>

  <!-- 7 Floating Feature Badges on Orbits -->

  <!-- 1. Top-Left: Clock (Save Time) -->
  <g transform="translate(70, 160)" filter="url(#badgeShadow)">
    <circle cx="22" cy="22" r="22" fill="url(#iconBg1)"/>
    <circle cx="22" cy="22" r="11" stroke="#ffffff" stroke-width="2.2" fill="none"/>
    <polyline points="22,15 22,22 26,22" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 2. Top Center-Left: Bell / Notification -->
  <g transform="translate(160, 65)" filter="url(#badgeShadow)">
    <circle cx="20" cy="20" r="20" fill="url(#iconBg2)"/>
    <!-- Bell icon -->
    <path d="M20,11 C16.5,11 14.5,13.5 14.5,17 C14.5,21 12,23 12,24 L28,24 C28,23 25.5,21 25.5,17 C25.5,13.5 23.5,11 20,11 Z" fill="#ffffff"/>
    <path d="M18.5,25.5 C18.5,26.5 19.2,27 20,27 C20.8,27 21.5,26.5 21.5,25.5" stroke="#ffffff" stroke-width="1.8" fill="none"/>
  </g>

  <!-- 3. Top Right: Chart / Analytics -->
  <g transform="translate(390, 130)" filter="url(#badgeShadow)">
    <circle cx="22" cy="22" r="22" fill="url(#iconBg1)"/>
    <polyline points="13,29 19,23 24,26 31,16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polyline points="27,16 31,16 31,20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- 4. Far Right: Bag / Orders -->
  <g transform="translate(425, 250)" filter="url(#badgeShadow)">
    <circle cx="20" cy="20" r="20" fill="url(#iconBg2)"/>
    <rect x="13" y="16" width="14" height="13" rx="2" fill="#ffffff"/>
    <path d="M16,16 C16,13 18,12 20,12 C22,12 24,13 24,16" stroke="#ffffff" stroke-width="2" fill="none"/>
  </g>

  <!-- 5. Bottom Right: Sewing Machine / Fabric -->
  <g transform="translate(365, 370)" filter="url(#badgeShadow)">
    <circle cx="22" cy="22" r="22" fill="url(#iconBg1)"/>
    <path d="M14,29 L30,29 C30,29 29,22 25,22 L18,22 C18,22 18,17 26,17 L29,17" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <circle cx="27" cy="17" r="2" fill="#ffffff"/>
  </g>

  <!-- 6. Bottom Left: Cloud (Access Anywhere) -->
  <g transform="translate(65, 310)" filter="url(#badgeShadow)">
    <circle cx="22" cy="22" r="22" fill="url(#iconBg2)"/>
    <path d="M15,26 C13,26 12,24.5 12,23 C12,21.5 13,20 15,20 C15.5,17.5 18,16 21,16 C24,16 26.5,18 27,20.5 C28.5,20.5 30,21.5 30,23 C30,24.8 28.5,26 27,26 Z" fill="#ffffff"/>
  </g>

  <!-- 7. Far Left: Scissors (Craft / Accuracy) -->
  <g transform="translate(20, 240)" filter="url(#badgeShadow)">
    <circle cx="20" cy="20" r="20" fill="url(#iconBg1)"/>
    <circle cx="15" cy="16" r="3" stroke="#ffffff" stroke-width="1.8" fill="none"/>
    <circle cx="15" cy="24" r="3" stroke="#ffffff" stroke-width="1.8" fill="none"/>
    <line x1="18" y1="17" x2="27" y2="25" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="23" x2="27" y2="15" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Small floating sparkle dots -->
  <circle cx="120" cy="130" r="3" fill="#818cf8"/>
  <circle cx="340" cy="90" r="3.5" fill="#a78bfa"/>
  <circle cx="370" cy="290" r="2.5" fill="#c084fc"/>
  <circle cx="170" cy="370" r="3" fill="#818cf8"/>
</svg>
